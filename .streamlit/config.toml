# Configuración compartida del repo.
# Streamlit Community Cloud solo lee el config de la RAÍZ del repo; la copia de la app
# (app/sismo_app_F/sismo_app/.streamlit/config.toml) queda para ejecutarla localmente.
[theme]
base = "dark"
primaryColor = "#FF7A45"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#161B26"
textColor = "#E6E9EF"

[server]
maxUploadSize = 500
